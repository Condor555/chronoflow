<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12324a">
  <meta name="description" content="Chrono Flow: tempo, presenze e calendari condivisi con privacy selettiva.">
  <title>Chrono Flow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">Chrono <span>Flow</span></div>
    <div class="header-actions"><button id="home-nav" class="secondary" hidden>Oggi</button><button id="calendar-nav" class="secondary" hidden>Calendario</button><button id="sign-out" class="secondary" hidden>Esci</button></div>
  </header>
  <main id="app" tabindex="-1">

  <div id="status" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="src/app.mjs"></script>

</html>
