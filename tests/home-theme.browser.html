<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Chrono Flow · deep Home theme test</title><link rel="stylesheet" href="../styles.css"></head>
<body>
  <main id="fixture">
    <article id="work-timer-card" class="hero-card mode-office" data-mode="office">
      <p id="work-mode-label" class="hero-mode-label"></p>
      <p class="auto-exit-note">Uscita automatica alle 16:06</p>
      <div class="action-stack"><button class="primary">Inizia pausa</button></div>
    </article>
    <pre id="results" aria-live="polite"></pre>
  </main>
  <script type="module">
    import { applyHomeModePresentation } from '../src/home-display.mjs';
    const card = document.querySelector('#work-timer-card');
    const label = document.querySelector('#work-mode-label');
    const output = document.querySelector('#results');
    const rows = [];
    function rgb(value) {
      if (value.trim().startsWith('#')) {
        const hex = value.trim().slice(1);
        return [0, 2, 4].map((offset) => Number.parseInt(hex.slice(offset, offset + 2), 16));
      }
      return (value.match(/[\d.]+/g) || []).slice(0,3).map(Number);
    }
    function luminance(value) {
      const channels = rgb(value).map((channel) => { const x = channel / 255; return x <= .04045 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; });
      return .2126 * channels[0] + .7152 * channels[1] + .0722 * channels[2];
    }
    function contrastRatio(a, b) { const [hi, lo] = [luminance(a), luminance(b)].sort((x,y) => y-x); return (hi + .05) / (lo + .05); }
    let failed = false;
    for (const mode of ['office','smart','travel']) {
      applyHomeModePresentation(card, label, mode, document);
      const style = getComputedStyle(card);
      const decoration = getComputedStyle(card, '::after');
      const from = getComputedStyle(document.documentElement).getPropertyValue(`--home-${mode}-deep-from`).trim();
      const to = getComputedStyle(document.documentElement).getPropertyValue(`--home-${mode}-deep-to`).trim();
      const assertions = [
        ['card uses a deep gradient', style.backgroundImage !== 'none' && style.backgroundImage.includes('linear-gradient')],
        ['both gradient endpoints preserve WCAG AA', contrastRatio(from, style.color) >= 4.5 && contrastRatio(to, style.color) >= 4.5],
        ['soft circular decoration is present', decoration.content !== 'none' && decoration.borderRadius === '50%'],
        ['automatic-exit microcopy remains integrated', getComputedStyle(card.querySelector('.auto-exit-note')).color === style.color],
        ['DOM mode is synchronized', card.dataset.mode === mode]
      ];
      for (const [name, passed] of assertions) { rows.push(`${passed ? 'PASS' : 'FAIL'} · ${mode} · ${name}`); failed ||= !passed; }
    }
    output.textContent = rows.join('\n');
    document.documentElement.dataset.result = failed ? 'failed' : 'passed';
    if (failed) throw new Error('Deep Home theme computed-style regression');
  </script>
</body></html>
