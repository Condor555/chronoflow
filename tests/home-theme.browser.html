<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Chrono Flow · computed style theme test</title><link rel="stylesheet" href="../styles.css"></head>
<body>
  <main id="fixture">
    <p id="work-mode-label"></p>
    <article id="work-timer-card" class="hero-card mode-office" data-mode="office"></article>
    <span id="today-type-badge" class="type-badge">Ufficio</span>
    <pre id="results" aria-live="polite"></pre>
  </main>
  <script type="module">
    import { applyHomeModePresentation } from '../src/home-display.mjs';
    const card = document.querySelector('#work-timer-card');
    const label = document.querySelector('#work-mode-label');
    const pill = document.querySelector('#today-type-badge');
    const output = document.querySelector('#results');
    const rows = [];
    function rgb(value) { return (value.match(/[\d.]+/g) || []).slice(0,3).map(Number); }
    function luminance(value) {
      const channels = rgb(value).map((channel) => { const x = channel / 255; return x <= .04045 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; });
      return .2126 * channels[0] + .7152 * channels[1] + .0722 * channels[2];
    }
    function contrastRatio(a, b) { const [hi, lo] = [luminance(a), luminance(b)].sort((x,y) => y-x); return (hi + .05) / (lo + .05); }
    let failed = false;
    for (const mode of ['office','smart','travel']) {
      applyHomeModePresentation(card, label, mode, document);
      pill.className = `type-badge ${mode}`;
      const cardStyle = getComputedStyle(card);
      const pillStyle = getComputedStyle(pill);
      const assertions = [
        ['card and pill share the exact solid background', cardStyle.backgroundColor === pillStyle.backgroundColor],
        ['card contrast is WCAG AA', contrastRatio(cardStyle.backgroundColor, cardStyle.color) >= 4.5],
        ['DOM mode is synchronized', card.dataset.mode === mode]
      ];
      for (const [name, passed] of assertions) { rows.push(`${passed ? 'PASS' : 'FAIL'} · ${mode} · ${name}`); failed ||= !passed; }
    }
    output.textContent = rows.join('\n');
    document.documentElement.dataset.result = failed ? 'failed' : 'passed';
    if (failed) throw new Error('Home theme computed-style regression');
  </script>
</body></html>
